[package]
name = "rust-ic-strands"
version = "0.0.0"
edition = "2021"
description = "disp's interaction net as strands on the links of a lattice, moved by local thermal dynamics"
license = "MIT"

[lib]
crate-type = ["rlib"]

[dependencies]
rust-ca-lattice = { path = "../../rust-ca-lattice/crate" }
rust-ic-mesh = { path = "../../rust-ic-mesh/crate" }
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "vulkan", "wgsl"], optional = true }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1", optional = true }

[features]
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]

[[bin]]
name = "strands-gpu"
required-features = ["gpu"]

[profile.release]
opt-level = 3
debug = false

[profile.wasm]
inherits = "release"
lto = false
codegen-units = 1
strip = true
panic = "abort"
